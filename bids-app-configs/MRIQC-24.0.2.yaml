# MRIQC on Unity — the live config. mechababs' own examples/ stay generic; this is
# what actually runs, so the real site paths live here.

mechababs:
  # mechababs-only namespace: consumed by mechababs, stripped before the config
  # reaches babs. selection = the scaffold-time subject-eligibility rule;
  # container = which image to hand `babs init --container-ds/--container-name`.
  selection:
    require_datatypes: [anat]
    require_positive: [t1w_num]
  container:
    # A plain ReproNim/containers clone — no shim. babs resolves the image out of
    # the datalad-containers registration (images/bids/bids-mriqc--24.0.2.sif) rather than
    # its own hardcoded layout, which needs babs carrying PennLINC/babs#399:
    # merged upstream, in no release yet, so the campaign pins babs by git ref
    # instead of taking the released default.
    #
    # In $HOME, not the PI space: the PI dir gets wiped, and re-fetching the
    # images every time is expensive. Absolute and local on purpose — a relative
    # source resolves against the STUDY root, and babs installs this dataset into
    # every derivative it inits, so a URL would pay a fresh clone per cell.
    source: /home/f006rq8_dartmouth_edu/devel/containers
    name: bids-mriqc

# BIDS-study layout (babs#369): the babs project root IS the analysis dataset, so
# the derivative dir is itself a valid BIDS dataset. The RIA stores go under
# .babs/ rather than babs's default top-level input_ria/output_ria, which would
# sit at the dataset's top level. Passed straight through to babs.
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

bids_app_args:
  --no-datalad-get: ""
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  # babs expands this exact token to "${PWD}/.git/tmp/wkdir" — the same directory
  # a relative -w named, but absolute, so the --pwd fixup that used to compensate
  # for the relative form is gone (con/mechababs#81).
  -w: "$BABS_TMPDIR"
  --n_cpus: "4"
  --mem_gb: "16"
  -vv: ""
  --no-sub: ""
  # T1w only while `templateflow.required` covers only the anatomical IQMs; drop
  # once the dry run with BOLD has extended the list.
  -m: "T1w"

singularity_args:
  - --containall
  # Route the container's /tmp to real scratch disk. $JOB_TMP is created and
  # trap-cleaned by the cluster config's script_preamble.
  - -B $JOB_TMP:/tmp

# Templateflow as a pinned subdataset of the derivative (babs branch
# templateflow-subdataset): each job fetches exactly `required` and records it as a
# `datalad run` input; the App sees it read-only. `required` comes from a dry run of
# MRIQC 24.0.2 with these arguments (see babs docs, "Finding the required list").
templateflow:
  url: "https://github.com/templateflow/templateflow.git"
  required:
    # anatomical IQMs (dry run 2026-10-09, -m T1w)
    - "tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-01_label-CSF_probseg.nii.gz"
    - "tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-01_label-GM_probseg.nii.gz"
    - "tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-01_label-WM_probseg.nii.gz"
    - "tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-02_desc-brain_mask.nii.gz"
    - "tpl-MNI152NLin2009cAsym/tpl-MNI152NLin2009cAsym_res-02_T1w.nii.gz"

# TODO: partition/nodes/ntasks belong on the cluster axis, not here — the cluster
# sets limits, the app sets minimums, and dataset chunk size informs the request
# (con/mechababs#3, #97).
cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "24:00:00"
  # 40G rather than 24G: the 2026-08 Unity shakeout OOM'd synthstrip at 24G. The
  # bump fixed most of those jobs; one session still exceeded 40G, so this is a
  # floor that is known to work, not a proven ceiling.
  customized_text: |
    #SBATCH --cpus-per-task=4
    #SBATCH --mem=48G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  mriqc: "24-0-2"
