mechababs:
  # Stage 1 of the FS8 -> fMRIPrep resampling -> full chain (hub workdoc fs8-chain).
  # FreeSurfer runs here, as its own stage; the fMRIPrep stages reuse this recon
  # instead of running their own.
  selection:
    require_datatypes: [anat]
    require_positive: [t1w_num]
  container:
    # bids-apps/freesurfer#100 build (docker://bids/freesurfer:8.2.0-unstable,
    # ReproNim/containers bids-freesurfer) with run.py from asmacdo/bids-app-freesurfer
    # @26e896c (branch fs8-image: the bids-apps/freesurfer#105 one-session naming fix
    # + #108, which strips the sub-/ses- prefixes babs passes) layered on, built on
    # Unity by build-fs8-patched-image.sh and registered in this local clone only as
    # bids-freesurfer-fs105-fs108 ->
    # images/bids/bids-freesurfer--8.2.0-unstable+fs105-fs108-26e896c.sif.
    # Back to the upstream image once both merge and are built. Not the neurodesk image.
    source: /home/f006rq8_dartmouth_edu/devel/containers
    name: bids-freesurfer-fs105-fs108

# Same layout as every other config in a campaign (must match across pipelines).
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# The bids-apps/freesurfer CLI (run.py), not fMRIPrep's: underscored flags.
#
# FreeSurfer-then-reuse means fMRIPrep reuses a plain recon-all, not its own
# flavour: fMRIPrep's internal recon (read from c6's recon-all.log) skips
# FreeSurfer's skull strip for its own, never passes -3T, and runs most surface
# steps itself. This app uses FreeSurfer's own skull strip, and feeds recon-all
# every T1w where fMRIPrep's default (first-lex) uses the first.
bids_app_args:
  $SUBJECT_SELECTION_FLAG: "--participant_label"
  # One config for every dataset shape: a session-level job is one session,
  # reconstructed on its own (cross-sectional), named sub-X_ses-Y; a subject-level
  # job (dataset without sessions) is sub-X. Needs babs passing this flag only at
  # session level (PennLINC/babs#421) and the app naming a one-session run
  # sub-X_ses-Y (bids-apps/freesurfer#105); both are fixes we carry until merged.
  $SESSION_SELECTION_FLAG: "--session_label"
  # A no-op for session-level jobs (a one-session clone takes the #105 path, which
  # ignores --steps) and for datasets without sessions. It matters only for a
  # subject-level job on a dataset with sessions, which sees every session: there
  # the app's default is the longitudinal stream (each session, a base, each
  # .long), and this makes it one cross-sectional sub-X_ses-Y per session instead,
  # the same shape a session-level run gives. mechababs runs such a job only once
  # con/mechababs#156's processing-level override exists; revisit then.
  --steps: "cross-sectional"
  # DECIDED 2026-11-02, uncertain: off. The app defaults it on whatever the field
  # strength, and OpenNeuro is not all 3T. fMRIPrep never passes -3T (it does its
  # own N4 bias correction first), so off also matches what fMRIPrep would have
  # done. Per-dataset from MagneticFieldStrength would be the refinement; untested
  # either way.
  --3T: "false"
  # DECIDED 2026-11-02, uncertain: T2. Refines the pial surface with a T2w of
  # ~1.2 mm or finer when the subject has one, else T1 alone. Must be passed: the
  # app's default is the list ['T2'], which never equals "T2", so without this
  # flag no T2w is used (upstream report pending).
  # fMRIPrep also uses T2w/FLAIR by default (--ignore t2w/flair exist), but
  # exactly how it uses them is unverified, so whether this matches is unknown.
  --refine_pial: "T2"
  # Default auto: -hires only for sub-mm data, as fMRIPrep's --submm-recon default.
  --hires_mode: "auto"
  --skip_bids_validator: ""
  --n_cpus: "2"
  # babs binds the FreeSurfer license only for a key spelled --fs-license-file
  # (generate_bidsapp_runscript.py), which this app does not take. So the license
  # is bound by hand in singularity_args and the app is pointed at it here.
  # TODO: babs issue, not filed (fMRIPrep's flag name hardcoded); related:
  # con/mechababs#29 (license + templateflow binds portable).
  --license_file: "/fs-license.txt"

singularity_args:
  - --containall
  - -B $JOB_TMP:/tmp
  # HOST path, bound by hand (see --license_file above).
  - -B /home/f006rq8_dartmouth_edu/license.txt:/fs-license.txt

cluster_resources:
  interpreting_shell: "/bin/bash"
  # First actuals (typhon, straight singularity, ds000030 sub-10159, n = 1,
  # 2026-11-02): wall 1 h 32 m, peak RSS 31.8 GB, CPU peak 392 % despite
  # --n_cpus 2. 32G would sit at the limit, so 48G; walltime left generous.
  hard_runtime_limit: "2-00:00:00"
  customized_text: |
    #SBATCH --cpus-per-task=2
    #SBATCH --mem=48G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  # Key == this pipeline's short_name (filename stem).
  FreeSurfer-8.2.0: "8-2-0"
