mechababs:
  # mechababs-only config: consumed by mechababs, stripped by merge_config so none
  # of it reaches the babs config. selection = deploy-time subject-eligibility rule;
  # container = which image to vendor + pass to `babs init --container-ds/--container-name`.
  selection:
    require_datatypes: [anat, func]
    require_positive: [t1w_num, bold_num]
  # The orchestration edge, mechababs-owned and separate from babs's
  # `input_datasets` below: this names the producer by STEM so the cell is not
  # scaffolded until that producer's cell has merged. ORDERING ONLY — the input
  # wiring is `input_datasets`.
  depends_on: fMRIPrep-25.2.5+anat
  container:
    # A plain ReproNim/containers clone — no shim. babs resolves the image out of
    # the datalad-containers registration (images/bids/bids-fmriprep--25.2.5.sif) rather than
    # its own hardcoded layout, which needs babs carrying PennLINC/babs#399:
    # merged upstream, in no release yet, so the campaign pins babs by git ref
    # instead of taking the released default.
    #
    # ABSOLUTE and local on purpose: a relative source resolves against the STUDY
    # root, and babs installs this dataset into every derivative it inits, so a
    # URL would pay a fresh clone per cell.
    source: /work/pi_d31548v_dartmouth_edu/asmacdo/containers
    name: bids-fmriprep

# BIDS-study layout (babs#369): the babs project root IS the analysis dataset,
# and the RIA stores go under .babs/ — babs's default top-level input_ria/output_ria
# would break datalad's nesting of the (untracked) babs project inside the study.
# Campaign-wide layout choice, living per-pipeline for now (see config-composition-axes);
# MUST match across every pipeline in a campaign. merge_config passes these straight
# into the babs config.
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# fmriprep --level resampling, chained on anat-only output.
# Nominally sits between minimal and full. In fmriprep today it is
# equivalent to minimal -- resampling does not yet emit confounds, which
# still come only from --level full. The stage is kept as a no-op hook
# for the planned confounds-at-resampling change (#17), so we can upgrade
# in place when it lands.
#
# Pair-runs with the minimal and full YAMLs off the same anat
# scaffold so we can diff the three outputs directly.
bids_app_args:
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  # babs expands this exact token to "${PWD}/.git/tmp/wkdir" — the same directory
  # a relative -w named, but absolute, so the --pwd fixup that used to compensate
  # for the relative form is gone (con/mechababs#81).
  -w: "$BABS_TMPDIR"
  --level: "resampling"
  --output-spaces: "MNI152NLin2009cAsym:res-2:res-native MNI152NLin6Asym:res-2:res-native fsaverage"
  --cifti-output: "91k"
  --random-seed: "12345"
  --skull-strip-fixed-seed: ""
  --skull-strip-t1w: "force"
  --use-syn-sdc: "warn"
  --me-output-echos: ""
  --notrack: ""
  --md-only-boilerplate: ""
  --skip-bids-validation: ""
  --stop-on-first-crash: ""
  # HOST path; BABS rewrites to /SGLR/FREESURFER_HOME/license.txt.
  --fs-license-file: "/home/f006rq8_dartmouth_edu/license.txt"
  # Path inside the unzipped fMRIPrep-25.2.5+anat input. The double nesting
  # is real: path_in_babs is sourcedata/fMRIPrep-25.2.5+anat, and the zip's
  # top folder is also fMRIPrep-25.2.5+anat/.
  --fs-subjects-dir: '"${PWD}"/sourcedata/fMRIPrep-25.2.5+anat/fMRIPrep-25.2.5+anat/sourcedata/freesurfer'
  # Reuse the anat stage's precomputed derivatives (fmriprep --derivatives
  # PACKAGE=PATH) so the anatomical set is taken from anat's output rather than
  # recomputed. Same input mount as --fs-subjects-dir above, minus the
  # /sourcedata/freesurfer tail: this points at the anat derivative root
  # (sub-*/anat + dataset_description.json). --fs-subjects-dir stays — FreeSurfer
  # reuse is a separate mechanism.
  --derivatives: 'anat="${PWD}"/sourcedata/fMRIPrep-25.2.5+anat/fMRIPrep-25.2.5+anat'
  --nprocs: "4"
  --omp-nthreads: "2"
  --mem-mb: "32000"

singularity_args:
  - --containall
  - -B $JOB_TMP:/tmp
  - -B /work/pi_d31548v_dartmouth_edu/asmacdo/templateflow:/templateflow
  - --env TEMPLATEFLOW_HOME=/templateflow

# Chained input: the anat-only stage's output. The key names WHICH upstream
# by matching the producing pipeline's short_name (fMRIPrep-25.2.5+anat); that
# name match is how iterate assembles the chain. origin_url is intentionally
# omitted — the upstream RIA doesn't exist until anat has run + merged, so
# iterate resolves it per run and injects it at scaffold (a per-run absolute RIA
# path, not a config constant).
input_datasets:
  fMRIPrep-25.2.5+anat:
    required_files:
      - "*fMRIPrep-25.2.5+anat*.zip"
    is_zipped: true
    path_in_babs: sourcedata/fMRIPrep-25.2.5+anat

cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "24:00:00"
  # Discovery doesn't track per-node TmpDisk in slurm (all nodes
  # report TmpDisk=0), so --tmp=anything is rejected as unsatisfiable.
  # We bind ${JOB_TMP} to /tmp inside the container instead.
  # temporary_disk_space: 200G
  customized_text: |
    #SBATCH --cpus-per-task=8
    #SBATCH --mem=40G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  # Key == this pipeline's short_name (filename stem); it names the output folder
  # the app writes into and that babs zips.
  fMRIPrep-25.2.5+resampling: "25-2-5"
